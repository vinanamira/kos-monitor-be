# Blueprint Render: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: kos-monitor-be
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: TOPIC_PREFIX
        value: kosdemo/icha-kos
